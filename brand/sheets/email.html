<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facet — Email Header Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&family=DM+Sans:opsz,wght@9..40,300;9..40,400&family=DM+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1d24;
  font-family: 'DM Sans', sans-serif;
  padding: 40px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 56px;
}
.sheet-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: #6cb8e8;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 6px 14px;
  border: 1px solid rgba(108, 184, 232, 0.3);
  border-radius: 4px;
  background: rgba(10, 12, 16, 0.5);
  margin-bottom: 12px;
}
.sheet-item { display: flex; flex-direction: column; align-items: center; }

/* Render mode: when URL has a variant hash, isolate that variant for screenshot */
body.render { padding: 0; gap: 0; background: #0a0c10; }
body.render .sheet-label { display: none; }
body.render .sheet-item { margin: 0; }
body.render .sheet-item.hidden { display: none; }

/* ─────────────────────────────────────────────────────────────
   #email-dark  ·  1200×400  ·  Email newsletter header (dark)
   Renders at 600×200 in email clients (2× retina source).
   ───────────────────────────────────────────────────────────── */
#email-dark {
  width: 1200px; height: 400px;
  background: #0a0c10;
  position: relative; overflow: hidden;
}
#email-dark::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 50% 60% at 25% 50%,
    rgba(108,184,232,0.10) 0%, rgba(45,106,150,0.04) 35%, transparent 70%);
  pointer-events: none;
}
#email-dark::after {
  content: ''; position: absolute; inset: 0; opacity: 0.4;
  background-image:
    linear-gradient(rgba(108,184,232,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,184,232,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
#email-dark .frame {
  position: relative; height: 100%;
  padding: 56px 72px;
  display: flex; flex-direction: column;
  justify-content: center;
  z-index: 1;
}
#email-dark .lockup {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px;
}
#email-dark .lockup-text {
  font-family: 'Instrument Serif', Georgia, serif;
  font-weight: 400; font-size: 56px; color: #e8ecf2;
  letter-spacing: 2px; line-height: 1;
}
#email-dark .divider {
  width: 64px; height: 1px;
  background: linear-gradient(90deg, #5ba4d9 0%, transparent 100%);
  margin-bottom: 14px;
}
#email-dark .tagline {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: #6cb8e8;
  letter-spacing: 2.5px; text-transform: uppercase;
  margin-bottom: 8px;
}
#email-dark .trust {
  font-family: 'DM Sans', sans-serif;
  font-weight: 300; font-size: 16px;
  color: #c0c8d4;
  line-height: 1.5;
  max-width: 620px;
}
#email-dark .trust .accent {
  color: #6cb8e8;
}
#email-dark .url {
  position: absolute;
  right: 72px; bottom: 56px;
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: #5ba4d9;
  letter-spacing: 1.5px;
  opacity: 0.85;
}

/* ─────────────────────────────────────────────────────────────
   #email-light  ·  1200×400  ·  Email newsletter header (light)
   ───────────────────────────────────────────────────────────── */
#email-light {
  width: 1200px; height: 400px;
  background: #f8fafc;
  position: relative; overflow: hidden;
}
#email-light::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 50% 60% at 25% 50%,
    rgba(45,106,150,0.07) 0%, rgba(45,106,150,0.03) 35%, transparent 70%);
  pointer-events: none;
}
#email-light::after {
  content: ''; position: absolute; inset: 0; opacity: 0.5;
  background-image:
    linear-gradient(rgba(45,106,150,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45,106,150,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
#email-light .frame {
  position: relative; height: 100%;
  padding: 56px 72px;
  display: flex; flex-direction: column;
  justify-content: center;
  z-index: 1;
}
#email-light .lockup {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px;
}
#email-light .lockup-text {
  font-family: 'Instrument Serif', Georgia, serif;
  font-weight: 400; font-size: 56px; color: #0f172a;
  letter-spacing: 2px; line-height: 1;
}
#email-light .divider {
  width: 64px; height: 1px;
  background: linear-gradient(90deg, #2d6a96 0%, transparent 100%);
  margin-bottom: 14px;
}
#email-light .tagline {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: #2d6a96;
  letter-spacing: 2.5px; text-transform: uppercase;
  margin-bottom: 8px;
}
#email-light .trust {
  font-family: 'DM Sans', sans-serif;
  font-weight: 300; font-size: 16px;
  color: #475569;
  line-height: 1.5;
  max-width: 620px;
}
#email-light .trust .accent {
  color: #2d6a96;
}
#email-light .url {
  position: absolute;
  right: 72px; bottom: 56px;
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: #2d6a96;
  letter-spacing: 1.5px;
  opacity: 0.85;
}
</style>
</head>
<body>

<!--
  Email sheet · 1200×400 newsletter masthead. Source PNG renders at 2×
  for retina; intended display size is 600×200 in email clients (which
  is the long-standing standard max-width). Left-aligned composition
  keeps it feeling like a newsletter masthead rather than a centered
  identity hero.

  Trust line uses the canonical "Open-source · Your data, never ours"
  positioning — credibility for the paid hosted version.
-->

<!-- ─── EMAIL · DARK ─── -->
<div class="sheet-item">
  <div class="sheet-label">#email-dark · 1200×400</div>
  <div id="email-dark">
    <div class="frame">
      <div class="lockup">
        <svg width="48" height="70" viewBox="0 0 22 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 2 H16 L20 9 H2 Z" fill="#6cb8e8"/>
          <path d="M8 3.5 H14 L16.5 8 H5.5 Z" fill="#7ac4f0" opacity="0.25"/>
          <path d="M2 9 L11 31 L11 9 Z" fill="#2d6a96"/>
          <path d="M20 9 L11 31 L11 9 Z" fill="#4a94c8"/>
          <line x1="1.5" y1="9" x2="20.5" y2="9" stroke="#7ac4f0" stroke-width="0.5" opacity="0.5"/>
          <line x1="11" y1="2" x2="11" y2="31" stroke="#7ac4f0" stroke-width="0.35" opacity="0.25"/>
        </svg>
        <span class="lockup-text">Facet</span>
      </div>
      <div class="divider"></div>
      <div class="tagline">Same diamond · Different face</div>
      <div class="trust"><span class="accent">Open-source.</span> Your data, never ours.</div>
    </div>
    <div class="url">myfacets.cv</div>
  </div>
</div>

<!-- ─── EMAIL · LIGHT ─── -->
<div class="sheet-item">
  <div class="sheet-label">#email-light · 1200×400</div>
  <div id="email-light">
    <div class="frame">
      <div class="lockup">
        <svg width="48" height="70" viewBox="0 0 22 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 2 H16 L20 9 H2 Z" fill="#2d6a96"/>
          <path d="M8 3.5 H14 L16.5 8 H5.5 Z" fill="#5ba4d9" opacity="0.25"/>
          <path d="M2 9 L11 31 L11 9 Z" fill="#1e5a82"/>
          <path d="M20 9 L11 31 L11 9 Z" fill="#2d6a96"/>
          <line x1="1.5" y1="9" x2="20.5" y2="9" stroke="#5ba4d9" stroke-width="0.5" opacity="0.5"/>
          <line x1="11" y1="2" x2="11" y2="31" stroke="#5ba4d9" stroke-width="0.35" opacity="0.25"/>
        </svg>
        <span class="lockup-text">Facet</span>
      </div>
      <div class="divider"></div>
      <div class="tagline">Same diamond · Different face</div>
      <div class="trust"><span class="accent">Open-source.</span> Your data, never ours.</div>
    </div>
    <div class="url">myfacets.cv</div>
  </div>
</div>

<script>
  // Render mode: hash like #email-dark isolates that variant for Playwright screenshot.
  (function() {
    const hash = window.location.hash.slice(1);
    if (!hash) return;
    document.body.classList.add('render');
    const target = document.getElementById(hash);
    if (!target) return;
    const targetItem = target.closest('.sheet-item');
    document.querySelectorAll('.sheet-item').forEach(item => {
      if (item !== targetItem) item.classList.add('hidden');
    });
  })();
</script>

</body>
</html>
